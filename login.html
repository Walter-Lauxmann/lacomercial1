<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Comercial</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/estilos.css" />
</head>
<body>

    <main class="contenedor sombra">
        <h2>Iniciar Sesión</h2>        
        <!-- Envoltorio para alertas -->
        <div id="alerta"></div>
        <div class="formulario login-container">
            <form id="form-login">
                <fieldset>
                    <legend>Por favor, complete el siguiente formulario.</legend>
                    <table class="contenedor-campos">
                        <tr class="campo">
                            <td><label for="usuario">Usuario:</label></td>
                            <td><input type="text" class="form-control input-text" id="usuario" name="usuario" required autocomplete="username"></td>
                        </tr>
                        <tr class="campo">
                            <td><label for="password">Contraseña:</label></td>
                            <td><input type="password" class="form-control input-text" id="password" name="password" required autocomplete="current-password"></td>
                        </tr>
                    </table>
                    <button type="submit" class="boton">Ingresar</button>
                    <p class="text-center text-white">
                        ¿No tenés cuenta?
                        <a href="registro.html">Registrate acá</a>
                    </p>
                </fieldset>
            </form>
        </div>
    </main>
    <footer>
      <p>La Comercial - Todos los derechos reservados - 2026</p>
    </footer>
    
    <!-- Scripts -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./controladores/login-controlador.js"></script>
</body>
</html>
