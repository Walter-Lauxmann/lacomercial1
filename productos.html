<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Comercial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>
    <header>
        <h1>La Comercial</h1>
    </header>
    <nav class="menu">
        <div class="contenedor">
            <ul class="menu-flex">
                <li><a href="./">Inicio</a></li>
                <li><a href="./nosotros.html">Nosotros</a></li>
                <li><a href="./productos.html">Productos</a></li>
                <li><a href="./contactenos.html">Contáctenos</a></li>
            </ul>
        </div>
    </nav>
    <main class="contenedor sombra">
        <div id="alerta"></div>
        <div class="titulo-admin-flex">
            <h2>Listado de productos</h2>
            <button id="btn-nuevo-producto" class="boton-admin">
                Cargar nuevo producto
            </button>
        </div>

        <section class="servicios" id="lista-productos">
        
        </section>   
        
        <!-- Carrito de compras -->
         <section class="carrito">
            <h3>Carrito de compras</h3>
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Cantidad</th>
                        <th>Precio</th>
                        <th>Importe</th>
                    </tr>
                </thead>
                <tbody id="lista-tabla">                    
                
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="3"></td>
                        <td>Total</td>
                        <td>$ <span id="total"></span>.-</td>
                    </tr>
                </tfoot>
            </table>
         </section>
        

    </main>
    
    <!-- Diálogo modal para cargar / modificar productos -->
     <dialog id="dialogo-producto">
        <form id="form-producto" class="formulario-modal">
            <h3 id="dialogo-titulo">Cargar Producto</h3>
            <input type="hidden" id="modo-edicion" value="false" />
            <div class="campo-modal">
                <label for="prod-codigo">Código:</label>
                <input type="number" id="prod-codigo" name="codigo" min="1" required>
            </div>
            <div class="campo-modal">
                <label for="prod-nombre">Nombre:</label>
                <input type="text" id="prod-nombre" name="nombre" required>
            </div>
            <div class="campo-modal">
                <label for="prod-precio">Precio ($):</label>
                <input type="number" id="prod-precio" name="precio" min="0" required>
            </div>
            <div class="campo-modal">
                <label for="prod-imagen">Imagen (ej.: default.jpg):</label>
                <input type="text" id="prod-imagen" name="imagen" placeholder="default.jpg">
            </div>

            <fieldset class="especificaciones-grupo">
                <legend>Descripción</legend>

                <div class="campo-modal">                    
                    <textarea type="text" id="prod-descripcion" name="descripcion" placeholder="--Escriba aquí--">
                    </textarea>
                </div>
                
            </fieldset>

            <div class="form-botones">
                <button type="submit" class="boton-dialogo guardar">Guardar</button>
                <button type="button" id="btn-cancelar" class="boton-dialogo cancelar">Cancelar</button>
            </div>

        </form>
     </dialog>



    <footer>
        <p>La Comercial - Todos los derechos reservados - 2026</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="./controladores/lista-productos.js"></script>
    <script src="./controladores/carrito-compras.js"></script>
</body>
</html>
